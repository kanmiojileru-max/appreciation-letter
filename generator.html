<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Link Generator | CCC Letter</title>
<style>body{font-family:Georgia,serif;background:#f2eee3;color:#25362b;max-width:640px;margin:40px auto;padding:0 16px}h1{color:#064526;font-weight:normal}label{display:block;margin:14px 0 4px;font:600 13px Arial,sans-serif}input{width:100%;padding:11px;border:1px solid #c9a33e;border-radius:6px;font:16px Georgia,serif}button{margin-top:16px;border:1px solid #c9a33e;border-radius:999px;padding:12px 22px;background:#c79b30;color:#173c27;font:700 12px Arial,sans-serif;letter-spacing:.08em;cursor:pointer}#out{margin-top:20px;word-break:break-all;background:#fffaf0;border:1px solid #d7bc63;padding:12px;display:none;font:14px Arial,sans-serif}</style></head><body>
<h1>Personalised Link Generator</h1><p>Enter a recipient's details to create a link to the letter.</p>
<label for="n">Recipient name</label><input id="n" placeholder="e.g. Mrs. Adeyemi">
<label for="r">Role / description</label><input id="r" placeholder="e.g. Member, CCC Ijeshatedo Parish IV in Diaspora">
<button id="g">Create link</button> <button id="c">Copy</button><div id="out"></div>
<script>
const out=document.getElementById('out');
document.getElementById('g').onclick=()=>{const n=document.getElementById('n').value.trim();if(!n){alert('Please enter a name.');return}
const u=new URL('./',location.href);u.searchParams.set('name',n);const r=document.getElementById('r').value.trim();if(r)u.searchParams.set('role',r);out.textContent=u.href;out.style.display='block'};
document.getElementById('c').onclick=()=>{if(out.textContent)navigator.clipboard.writeText(out.textContent)};
</script></body></html>
